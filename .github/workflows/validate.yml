name: Validate theme package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n install.sh uninstall.sh scripts/check-package.sh
      - name: Validate package manifest
        run: bash scripts/check-package.sh
      - name: Scan for accidental secrets
        run: |
          private_key_pattern='BEGIN (RSA |OPENSSH )?PRIVATE ''KEY'
          app_key_pattern='APP_''KEY='
          db_password_pattern='DB_''PASSWORD='
          secret_pattern="${private_key_pattern}|${app_key_pattern}|${db_password_pattern}"
          ! grep -RInE --exclude-dir=.git "$secret_pattern" .
